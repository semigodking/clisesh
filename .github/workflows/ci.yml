name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Run Lint
        run: |
          go vet ./...
          gofmt_out=$(gofmt -l .)
          if [ -n "$gofmt_out" ]; then
            echo "gofmt check failed on:"
            echo "$gofmt_out"
            exit 1
          fi

      - name: Build Verification
        run: |
          make build
          ./bin/clisesh version
